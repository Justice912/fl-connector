  <rect x="850" y="520" width="350" height="110" rx="5" fill="#20262b" stroke="#fbbf24" stroke-width="4"/><text x="878" y="560" fill="#fbbf24" font-family="Segoe UI" font-size="20" font-weight="700">Match the listed start bars</text><text x="878" y="596" fill="#dbe5ee" font-family="Segoe UI" font-size="17">Patterns and audio stay aligned.</text>
