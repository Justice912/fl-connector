<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arrange the song in the Playlist</title><desc id="desc">Instructional map showing patterns and audio clips placed by bar in the Playlist.</desc>
  <rect width="1280" height="720" fill="#171b1f"/><rect width="1280" height="74" fill="#343a40"/><text x="38" y="46" fill="#f8fafc" font-family="Segoe UI" font-size="24">FL Studio 2025 placement guide</text>
  <rect x="35" y="105" width="1210" height="565" rx="6" fill="#111418" stroke="#59636d"/><text x="62" y="143" fill="#f8fafc" font-family="Segoe UI" font-size="21">Playlist - press F5</text>
  <g stroke="#343d45"><path d="M170 160v510M290 160v510M410 160v510M530 160v510M650 160v510M770 160v510M890 160v510M1010 160v510M1130 160v510"/><path d="M35 225h1210M35 305h1210M35 385h1210M35 465h1210M35 545h1210"/></g>
  <g fill="#cbd5df" font-family="Segoe UI" font-size="16"><text x="64" y="205">Drums</text><text x="64" y="285">Bass</text><text x="64" y="365">Keys</text><text x="64" y="445">Vocals</text></g>
